# Gigaspark OS - M7 (Primary Core) Configuration
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_THREAD_ID_PREFIX=y
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192

# IPC Service
CONFIG_IPC_SERVICE=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_SLAVE=n

# MBOX driver for STM32 HSEM
CONFIG_MBOX=y

# GPIO for LED + controls
CONFIG_GPIO=y

# Network stack (basic - WiFi firmware not available in this Zephyr version)
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

# Memory
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# I2S Audio (Zephyr driver)
CONFIG_I2S=y

# ADC for oscilloscope + power supply feedback
CONFIG_ADC=y

# SPI for MCP41010 digital pot + CC1101 RF
CONFIG_SPI=y

# I2C for PN532 NFC
CONFIG_I2C=y

# Flash storage + Settings persistence (Fase 23)
CONFIG_FLASH=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
