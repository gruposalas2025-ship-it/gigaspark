# Gigaspark OS - M4 (Remote Core) Configuration
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# IPC Service
CONFIG_IPC_SERVICE=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n

# MBOX driver for STM32 HSEM
CONFIG_MBOX=y

# Disk access (SD swap - graceful degradation if no SD)
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
