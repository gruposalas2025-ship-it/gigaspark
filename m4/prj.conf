# Gigaspark OS - M4 (Remote Core) Configuration
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# IPC Service
CONFIG_IPC_SERVICE=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n

# MBOX driver for STM32 HSEM
CONFIG_MBOX=y

# SPI driver for SD card
CONFIG_SPI=y

# Disk access (SD card)
CONFIG_DISK_ACCESS=y

# Filesystem
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=24
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
